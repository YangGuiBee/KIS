name: KIS daily paper sync

# 매일 AI Study(paper.html)의 논문 수집 구글시트에서 새 항목을 받아 cards/*.md로
# 영구 아카이브하고 index.html을 재빌드한다. paper.html 쪽 시트는 회전 캡이 있어
# 오래되면 지워지므로, 그 전에 KIS가 전량을 떠서 git에 영구 보관한다.
# (선행조건: AI Study의 appsscript.js에 getAllNews 액션이 실제 배포돼 있어야 함)

on:
  schedule:
    - cron: '0 23 * * *' # 매일 08:00 KST (UTC 전날 23:00) — 논문 수집(06:00 KST) 이후
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync new papers into cards/
        run: node tools/sync-papers.js

      - name: Rebuild index.html
        run: node build.js

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- cards/ index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/ index.html
          git commit -m "KIS: 논문 카드 자동 동기화 $(date +%Y-%m-%d)"
          git push origin main
