<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIS Event Admin</title>
  <style>
    :root{--ink:#172033;--mut:#667085;--line:#d9e2ec;--bg:#f7fafc;--card:#fff;--blue:#2563eb;--teal:#0f766e;--red:#dc2626}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',Arial,sans-serif}
    header{background:linear-gradient(135deg,#0f766e,#0891b2);color:white;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px}
    h1{font-size:24px;margin:0}
    .home{color:white;text-decoration:none;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:9px 14px;font-weight:700}
    main{max-width:1120px;margin:0 auto;padding:24px 28px 56px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
    input,select{height:42px;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:0 12px;font-size:15px}
    input{flex:1;min-width:260px}
    button{height:38px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font-weight:700;cursor:pointer;padding:0 12px}
    button:hover{border-color:var(--blue);color:var(--blue)}
    .count{color:var(--mut);font-weight:700;margin-left:auto}
    .notice{border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;border-radius:8px;padding:12px 14px;margin-bottom:16px;line-height:1.55}
    .grid{display:grid;gap:12px}
    .card{background:var(--card);border:1px solid var(--line);border-left:4px solid #38bdf8;border-radius:8px;padding:16px}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .title{font-size:18px;font-weight:800;line-height:1.45;margin:0 0 7px}
    .meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--mut);font-size:13px;margin-bottom:8px}
    .pill{border:1px solid #cffafe;background:#ecfeff;color:#0e7490;border-radius:999px;padding:2px 8px}
    .summary{color:#475467;line-height:1.6;margin:8px 0 12px}
    .cmd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
    code{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:8px 10px;color:#334155;word-break:break-all}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .primary{background:var(--blue);border-color:var(--blue);color:white}
    .primary:hover{background:#1d4ed8;color:white}
    .danger{color:var(--red)}
    a{color:var(--blue);text-decoration:none;font-weight:700}
    a:hover{text-decoration:underline}
    .empty{background:white;border:1px dashed var(--line);border-radius:8px;padding:32px;text-align:center;color:var(--mut)}
    .error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:16px;line-height:1.55}
    @media(max-width:700px){header{align-items:flex-start;flex-direction:column}.top{flex-direction:column}.count{margin-left:0}}
  </style>
</head>
<body>
  <header>
    <h1>KIS Event 관리자 검토</h1>
    <a class="home" href="../index.html">KIS로 돌아가기</a>
  </header>
  <main>
    <div class="notice">
      이 화면은 로컬 관리자 검토용입니다. 승인 전 후보는 공개 Event 탭에 표시되지 않습니다.
      게시하려면 후보의 승인 명령을 PowerShell에서 실행한 뒤 <code>node build.js</code>를 실행하세요.
    </div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="제목, 출처, 유형 검색">
      <select id="source"><option value="">전체 출처</option></select>
      <button id="reload" type="button">새로고침</button>
      <span class="count" id="count">0건</span>
    </div>
    <section class="grid" id="list"></section>
  </main>
  <script>
    const list = document.getElementById('list');
    const q = document.getElementById('q');
    const source = document.getElementById('source');
    const count = document.getElementById('count');
    let items = [];

    const esc = s => String(s || '').replace(/[&<>"']/g, ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[ch]));

    function command(id, action) {
      return action === 'approve'
        ? `node tools\\approve-event.js ${id}`
        : `node tools\\reject-event.js ${id} "관리자 제외"`;
    }

    async function copy(text) {
      try {
        await navigator.clipboard.writeText(text);
        alert('명령을 복사했습니다.');
      } catch {
        prompt('명령을 복사하세요.', text);
      }
    }

    function render() {
      const keyword = q.value.trim().toLowerCase();
      const src = source.value;
      const filtered = items.filter(it => {
        const hay = [it.title, it.summary, it.source, it.event_type, it.url].join(' ').toLowerCase();
        return (!keyword || hay.includes(keyword)) && (!src || it.source === src);
      });
      count.textContent = `${filtered.length}건`;
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">표시할 Event 후보가 없습니다.</div>';
        return;
      }
      list.innerHTML = filtered.map(it => {
        const approve = command(it.id, 'approve');
        const reject = command(it.id, 'reject');
        return `<article class="card">
          <div class="top">
            <div>
              <h2 class="title">${esc(it.title)}</h2>
              <div class="meta">
                <span class="pill">${esc(it.source)}</span>
                <span>${esc(it.event_type || '미확인')}</span>
                <span>일시 ${esc(it.event_date || '미확인')}</span>
                <span>장소 ${esc(it.place || '미확인')}</span>
                <span>비용 ${esc(it.fee || '미확인')}</span>
              </div>
            </div>
            <a href="${esc(it.url)}" target="_blank" rel="noopener">원문 보기</a>
          </div>
          <p class="summary">${esc(it.summary || '(요약 없음)')}</p>
          <div class="cmd">
            <code>${esc(approve)}</code>
            <div class="actions">
              <button class="primary" type="button" onclick="copy('${esc(approve)}')">승인 명령 복사</button>
              <button class="danger" type="button" onclick="copy('${esc(reject)}')">제외 명령 복사</button>
            </div>
          </div>
        </article>`;
      }).join('');
    }

    async function load() {
      try {
        const res = await fetch('../data/events/pending-events.json?ts=' + Date.now());
        if (!res.ok) throw new Error(`pending-events.json ${res.status}`);
        items = await res.json();
        const sources = [...new Set(items.map(it => it.source).filter(Boolean))].sort();
        source.innerHTML = '<option value="">전체 출처</option>' + sources.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
        render();
      } catch (e) {
        count.textContent = '0건';
        list.innerHTML = `<div class="error">pending 목록을 읽지 못했습니다.<br>
        먼저 KIS 폴더에서 <code>node tools\\sync-events.js</code>를 실행한 뒤, 이 화면을 로컬 서버에서 열어주세요.<br>
        세부 오류: ${esc(e.message)}</div>`;
      }
    }

    q.addEventListener('input', render);
    source.addEventListener('change', render);
    document.getElementById('reload').addEventListener('click', load);
    load();
  </script>
</body>
</html>
